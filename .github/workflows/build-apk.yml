name: Build Roll for Trouble APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'payload/**'
      - 'tools/optimize_android_02.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild Android project
        run: |
          cat payload/RFT_Android_Project.zip.part-* > /tmp/RFT_Android_Project.zip
          rm -rf /tmp/rft-project
          mkdir -p /tmp/rft-project
          unzip -q /tmp/RFT_Android_Project.zip -d /tmp/rft-project
          test -f /tmp/rft-project/Roll_for_Trouble_Android_0.1/settings.gradle

      - name: Optimize Android 0.2
        run: python3 tools/optimize_android_02.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android 0.2 debug APK
        working-directory: /tmp/rft-project/Roll_for_Trouble_Android_0.1
        run: gradle assembleDebug --stacktrace

      - name: Upload Android 0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Roll-for-Trouble-Android-0.2-APK
          path: /tmp/rft-project/Roll_for_Trouble_Android_0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
