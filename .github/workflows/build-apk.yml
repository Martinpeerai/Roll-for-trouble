name: Build Roll for Trouble APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild project ZIP
        run: |
          cat payload/RFT_Android_Project.zip.part-* > /tmp/RFT_Android_Project.zip
          mkdir -p /tmp/rft-project
          unzip -q /tmp/RFT_Android_Project.zip -d /tmp/rft-project
          echo "Project reconstructed"
          ls -la /tmp/rft-project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/rft-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roll-for-Trouble-APK
          path: /tmp/rft-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
